[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphshield-model-lab"
version = "0.1.0"
description = "From-scratch GCN, GraphSAGE and GAT plus tabular baselines and a leak-aware evaluation harness for temporal fraud graphs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "graphshield-data-engine>=0.1,<0.2",
    "torch>=2.1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
tracking = ["mlflow>=2.9"]
tuning = ["optuna>=3.5"]
crosscheck = ["torch-geometric>=2.4"]

[project.scripts]
graphshield-lab = "graphshield_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
